<!DOCTYPE html>
<html lang="ru">

  <title>Такси Местное</title>

  <meta name="apple-mobile-web-app-capable" content="yes">

    h1 { font-size: 20px; font-weight: 900; color: #ffb300; margin-bottom: 8px; text-align: center; letter-spacing: 0.5px; text-transform: uppercase; }

    .header-phones { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .header-phones a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; background: #00A82F; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 800; border: 1.5px solid #00c739; transition: 0.2s; }
    .header-phones a:active { background: #008f27; }

    /* Переключатель режимов */
    .mode-switch { display: flex; background: #2c2c2c; border-radius: 12px; margin-bottom: 16px; overflow: hidden; border: 1px solid #3d3d3d; }
    .mode-tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 700; color: #888; cursor: pointer; transition: 0.3s; }
    .mode-tab.active { background: #ffb300; color: #121212; }

    .route-box { background: #2c2c2c; border-radius: 16px; padding: 12px; margin-bottom: 16px; }
    .input-wrapper { position: relative; margin-bottom: 14px; }
    .input-wrapper:last-child { margin-bottom: 0; }
    
    label { display: block; font-size: 11px; font-weight: 700; color: #aaaaaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .input-row { display: flex; gap: 8px; position: relative; }
    .input-row input { flex: 1; width: 100%; height: 48px; font-size: 15px; padding: 0 38px 0 12px; background: #1e1e1e; border: 1.5px solid #3d3d3d; border-radius: 10px; color: #fff; outline: none; transition: 0.2s; }
    .input-row input:focus { border-color: #ffb300; }
    
    .manual-btn { width: 48px; height: 48px; background: #2c2c2c; border: 1.5px solid #3d3d3d; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; flex-shrink: 0; transition: 0.2s; }
    .manual-btn:active { background: #444; border-color: #ffb300; }
    
    .clear-btn { position: absolute; right: 58px; top: 12px; width: 24px; height: 24px; background: #444; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; cursor: pointer; display: none; z-index: 10; }
    .intercity-clear { right: 12px; }

    .suggestions { position: absolute; top: 100%; left: 0; right: 56px; background: #2c2c2c; border: 1px solid #444; border-radius: 10px; max-height: 250px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.8); display: none; margin-top: 4px; }
    .suggestions.full-width { right: 0; }
    
    .suggestion-item { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #3d3d3d; cursor: pointer; line-height: 1.3; }
    .suggestion-item:active { background: #3d3d3d; }
    .suggestion-zone-tag { display: block; color: #ffb300; font-size: 12px; font-weight: 700; margin-top: 4px; }

    .zone-badge { font-size: 12px; color: #4caf50; font-weight: 600; margin-top: 6px; display: none; justify-content: space-between; padding: 0 4px; }
    .change-link { color: #ffb300; text-decoration: underline; cursor: pointer; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .option-btn { background: #2c2c2c; border: 1.5px solid #3d3d3d; border-radius: 12px; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; color: #aaa; cursor: pointer; transition: 0.2s; user-select: none; }
    .option-btn.active { background: #3e2700; border-color: #ffb300; color: #ffb300; }

    .btn-calc { width: 100%; height: 54px; background: #ffb300; color: #121212; font-size: 17px; font-weight: 800; border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 179, 0, 0.4); margin-bottom: 16px; transition: 0.2s;}
    .btn-calc:active { transform: scale(0.98); background: #e09e00; }

    .result-card { background: #2c2c2c; border-radius: 16px; padding: 18px; text-align: center; border: 1px solid #444; display: none; margin-bottom: 16px; }
    .route-title { font-size: 14px; font-weight: 600; color: #aaa; margin-bottom: 8px; line-height: 1.4; }
    .price-tag { font-size: 44px; font-weight: 900; color: #4caf50; margin-bottom: 8px; }
    .modifiers-list { font-size: 12px; color: #ffb300; font-weight: 600; }
    .error-msg { font-size: 14px; font-weight: 600; color: #ef5350; line-height: 1.4; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-box { background: #1e1e1e; width: 100%; max-width: 420px; max-height: 85vh; border-radius: 16px; display: flex; flex-direction: column; border: 1px solid #444; }
    .modal-header { padding: 16px; font-weight: 800; border-bottom: 1px solid #3d3d3d; display: flex; justify-content: space-between; align-items: center; }
    .modal-search { padding: 10px 16px; border-bottom: 1px solid #3d3d3d; background: #2c2c2c; }
    .modal-search input { width: 100%; height: 40px; background: #1e1e1e; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 0 12px; font-size: 14px; outline: none; }
    .modal-search input:focus { border-color: #ffb300; }
    .modal-list { overflow-y: auto; padding: 0; flex-grow: 1; }
    .modal-group { background: #2d2d2d; color: #ffb300; font-size: 11px; font-weight: 800; padding: 8px 14px; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; z-index: 2;}
    .modal-item { padding: 14px 20px; font-size: 15px; border-bottom: 1px solid #282828; cursor: pointer; color: #ddd; }
    
    .status-text { text-align: center; font-size: 12px; font-weight: bold; color: #777; margin-bottom: 10px; }
    .footer-bar { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 12px; font-size: 11px; color: #666; font-weight: 600; }
    .footer-bar .creator { color: #888; }
    .footer-bar .version { color: #4caf50; font-family: monospace; font-size: 12px; }

    #installPwaBtn {

      font-weight: bold; border-radius: 12px; margin-bottom: 15px; cursor: pointer; border: 1.5px solid #00c739; font-size: 14px;
    }
  </style>
</head>

  </div>

    </div>

  async function loadPrices() {
    const status = document.getElementById('statusText');
    try {
      const res = await fetch(SHEET_CSV);
      const csv = await res.text();
      const lines = csv.split('\n');
      const headers = lines[0].split(',').map(c => c.trim().toLowerCase());

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].trim().split(',').map(c => c.trim().toLowerCase());
        const rowId = row[0];
        if (!rowId) continue;
        for (let j = 1; j < headers.length; j++) {
          const colId = headers[j];
          const val = parseInt(row[j], 10);
          if (!isNaN(val) && colId) {
            priceMatrix[`${rowId}_${colId}`] = val;
            priceMatrix[`${colId}_${rowId}`] = val;
          }
        }
      }
      status.innerText = "База тарифов обновлена ✅";
      status.style.color = "#4caf50";
    } catch(e) {
      status.innerText = "Ошибка загрузки прайса ⚡";
      status.style.color = "#ef5350";
    }
  }
  loadPrices();

  function resolveZonesByText(txt, fullAddress = "") {
    if (!txt) return [];
    txt = txt.toLowerCase();
    fullAddress = fullAddress.toLowerCase();

    let match = fullAddress.match(/д\s*(\d+)/i) || fullAddress.match(/(\d+)/);
    let h = match ? parseInt(match[1], 10) : 0;

    // 0. АБСОЛЮТНЫЙ ПРИОРИТЕТ ДРУГИХ СЁЛ
    if (fullAddress.includes("нижн") && fullAddress.includes("иволг")) return [getZone("nizh_ivolga")];
    if (fullAddress.includes("верхн") && fullAddress.includes("иволг")) return [getZone("verkh_ivolga")];
    if (fullAddress.includes("с. иволгинск") || (fullAddress.includes("иволгинск") && !fullAddress.includes("днт"))) return [getZone("ivolginsk")];

    // 1. СТРОГИЕ МИКРОРАЙОНЫ
    if (fullAddress.includes("сотников") || (txt.includes("магистральн") && !txt.includes("автомагистральн"))) {
      if (fullAddress.includes("полян")) return [getZone("sotnikovo_polyana")];
      if (fullAddress.includes("родник") || fullAddress.includes("большая полян")) return [getZone("sotnikovo_rodniki")];
      if (fullAddress.includes("гибдд") || fullAddress.includes("здоровье") || fullAddress.includes("колобк")) return [getZone("sotnikovo_gibdd")];
      if (fullAddress.includes("церков") || fullAddress.includes("тухачевск") || fullAddress.includes("промышлен")) return [getZone("sotnikovo_tserkov")];
      if (fullAddress.includes("багульник") || fullAddress.includes("овощевод") || fullAddress.includes("созвезди")) return [getZone("sotnikovo_bagulnik")];
      if (fullAddress.includes("титан") || fullAddress.includes("респект")) return [getZone("sotnikovo_titan")];
      return [getZone("sotnikovo_selenge")];
    }
    if (fullAddress.includes("посель")) return [getZone("poselye_rosneft")]; 
    if (fullAddress.includes("исток")) return [fullAddress.includes("строй") ? getZone("stroybaza_istok") : getZone("istok_solnyshko")];
    if (fullAddress.includes("солдатск")) return [getZone("soldatskiy")];
    if (fullAddress.includes("аэропорт")) return [getZone("aeroport")];
    if (fullAddress.includes("нурселени")) return [getZone("nurselenie")];

        if (h > 0 && h < 146) return [getZone("trubacheeva_do_mason")];

    }

    // 3. УНИКАЛЬНЫЕ УЛИЦЫ НАШИХ ЗОН

        return [getZone("burvod"), getZone("leviy_bereg")];
    }

    // 5. ОСТАЛЬНЫЕ ГОРОДСКИЕ ПРОВЕРКИ
    if (txt.includes("весна") || txt.includes("коммунальник") || txt.includes("20 лет победы")) return [getZone("dnt_vesna_etc")];
    if (txt.includes("сибиряк") || txt.includes("стимул")) return [getZone("sibiryak_stimul")];
    if (txt.includes("дулан") || txt.includes("комсомольский")) return [getZone("dulan_ostrov")];
    if (txt.includes("черемушки")) return [getZone("cheremushki")];
    if (txt.includes("левый берег")) return [getZone("leviy_bereg")];
    if (txt.includes("мир")) return [getZone("mir")];

    if (fullAddress.includes("загорск") || fullAddress.includes("машзавод")) return [getZone("mashzavod")];

    return []; 
  }

  function setupCitySuggest(type) {
    const input = document.getElementById(`${type}Input`);
    const list = document.getElementById(`${type}List`);
    const clear = document.getElementById(`${type}Clear`);
    let timer;

    input.addEventListener('input', () => {
      clear.style.display = input.value.length > 0 ? 'flex' : 'none';
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) { list.style.display = 'none'; return; }

      timer = setTimeout(async () => {
        try {
          const res = await fetch("https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json", "Authorization": "Token " + DADATA_TOKEN },
            body: JSON.stringify({ query: q, count: 6, locations: [{ region: "Бурятия", area: "Иволгинский" }, { region: "Бурятия", city: "Улан-Удэ" }] })
          });
          const data = await res.json();
          list.innerHTML = "";
          
          if (data.suggestions && data.suggestions.length > 0) {
            data.suggestions.forEach(item => {
              const fullStr = item.unrestricted_value || item.value;
              const district = item.data?.city_district || item.data?.settlement_with_type || '';
              const zones = resolveZonesByText(item.value, fullStr);
              
              if (zones.length === 0) {
                  const div = document.createElement('div');
                  div.className = 'suggestion-item';
                  div.innerHTML = `<b>${item.value}</b><small style="display:block; color:#aaa; margin-top:4px;">${district}</small>
                                   <span class="suggestion-zone-tag" style="color:#ef5350;">(Нажмите, чтобы выбрать район)</span>`;
                  div.onclick = () => { input.value = item.value; list.style.display = 'none'; openModal(type); };
                  list.appendChild(div);
              } else {
                  zones.forEach(zone => {
                      const div = document.createElement('div');
                      div.className = 'suggestion-item';
                      div.innerHTML = `<b>${item.value}</b><small style="display:block; color:#aaa; margin-top:4px;">${district}</small>
                                       <span class="suggestion-zone-tag">📍 Район: ${zone.name}</span>`;
                      div.onclick = () => { input.value = item.value; list.style.display = 'none'; setZone(type, zone); };
                      list.appendChild(div);
                  });
              }
            });
            list.style.display = 'block';
          }
        } catch(e) {}
      }, 350);
    });
  }

  function renderModalList(filterQuery) {
    const l = document.getElementById('modalList');
    l.innerHTML = '';
    let currentGroup = '';
    ZONES.forEach(z => {
      if (filterQuery && !z.name.toLowerCase().includes(filterQuery) && !z.group.toLowerCase().includes(filterQuery)) return; 
      if (z.group !== currentGroup) {
        currentGroup = z.group;
        const header = document.createElement('div');
        header.className = 'modal-group';
        header.innerText = currentGroup;
        l.appendChild(header);
      }
      const d = document.createElement('div');
      d.className = 'modal-item'; 
      d.innerText = z.name;
      d.onclick = () => { setZone(modalTarget, z); closeModal(); };
      l.appendChild(d);
    });
  }

  // --- РАСЧЕТ ПО ГОРОДУ ---
  function calculateCity() {
    const card = document.getElementById('resultCard');
    if (!state.from || !state.to) { alert("Выберите районы"); return; }

    let mFrom = state.from.id;
    let mTo = state.to.id;

    if (mFrom === "urozhay") mFrom = "burvod";
    if (mTo === "urozhay") mTo = "burvod";
    if (mFrom === "suranzan") mFrom = "tulunzha";
    if (mTo === "suranzan") mTo = "tulunzha";

    let basePrice = priceMatrix[`${mFrom}_${mTo}`];
    if (!basePrice) {
      card.innerHTML = `<div class="route-title">${state.from.name} ➔ ${state.to.name}</div><div class="error-msg">Тариф уточняется у диспетчера.</div>`;
      card.style.display = 'block';
      return;
    }

    let finalPrice = basePrice;
    let modsText = [];

    const burvodGroup = ["burvod", "leviy_bereg", "urozhay", "sibiryak_stimul", "dnt_vesna_etc", "dulan_ostrov", "cheremushki", "uchhoz"];
    const tulunzhaGroup = ["tulunzha", "suranzan", "mir"];

    if ((state.from.id === "urozhay" && !burvodGroup.includes(state.to.id)) || (state.to.id === "urozhay" && !burvodGroup.includes(state.from.id))) {
        finalPrice += 50; modsText.push("📍 Доплата (СНТ Урожай) (+50₽)");
    }
    if ((state.from.id === "suranzan" && !tulunzhaGroup.includes(state.to.id)) || (state.to.id === "suranzan" && !tulunzhaGroup.includes(state.from.id))) {
        finalPrice += 50; modsText.push("📍 Доплата (СНТ Суранзан) (+50₽)");
    }

    if (state.delivery) { finalPrice += 150; modsText.push("📦 Доставка"); }
    if (state.stop) { finalPrice += 100; modsText.push("🛑 Заезд (+100₽)"); }
    if (state.luggage) { finalPrice += 50; modsText.push("🧳 Багаж (+50₽)"); }
    
    if (state.night) {
      const leftBank = ["tulunzha", "suranzan", "mir", "gurulba", "burvod", "leviy_bereg", "urozhay", "sibiryak_stimul", "dnt_vesna_etc", "dulan_ostrov", "cheremushki", "uchhoz", "sotnikovo_selenge", "sotnikovo_bagulnik", "sotnikovo_titan", "sotnikovo_tserkov", "sotnikovo_rodniki", "sotnikovo_gibdd", "sotnikovo_polyana", "poselye_rosneft", "poselye_shkola", "poselye_baris", "poselye_baris_500m", "poselye_edem", "poselye_konechnaya", "stroybaza_istok", "istok_solnyshko", "istok_mirnaya_baris", "istok_dalee_karyer", "soldatskiy", "aeroport", "nurselenie"];
      if (leftBank.includes(mFrom) && leftBank.includes(mTo)) {
        finalPrice += 50; modsText.push("🌙 Ночь/Погода (Местная) (+50₽)");
      } else {
        finalPrice += 100; modsText.push("🌙 Ночь/Погода (Дальняя) (+100₽)");
      }
    }

    card.innerHTML = `<div class="route-title">${state.from.name} <br>⬇<br> ${state.to.name}</div>
                      <div class="price-tag">${finalPrice} ₽</div>
                      ${modsText.length > 0 ? `<div class="modifiers-list">${modsText.join('<br>')}</div>` : ''}`;
    card.style.display = 'block';
  }

  // --- РАСЧЕТ МЕЖГОРОД ---
  async function calculateIntercity() {
    if(!intercityData.lat || !intercityData.lon) {
        alert("Выберите конечный пункт из выпадающего списка!");
        return;
    }
    
    const btn = document.getElementById('btnInterCalc');
    const card = document.getElementById('resultCard');
    btn.innerText = "Считаем маршрут...";
    
    let destNameLC = intercityData.addressName.toLowerCase();
    let matchedPrice = 0;
    
    for (let key in INTERCITY_PRICES) {
        if (destNameLC.includes(key)) {
            matchedPrice = INTERCITY_PRICES[key];
            break;
        }
    }

    let minivanAdd = state.minivan ? 500 : 0;
    
    if (matchedPrice > 0) {
        card.innerHTML = `<div class="route-title">Центр (Ленина, 61) <br>⬇<br> ${intercityData.addressName}</div>
                          <div class="price-tag">${matchedPrice + minivanAdd} ₽</div>
                          <div class="modifiers-list">Фиксированный тариф<br>${state.minivan ? '🚐 Минивэн (+500₽)' : ''}</div>`;
        card.style.display = 'block';
        btn.innerText = "РАССЧИТАТЬ МЕЖГОРОД";
        return;
    }

    try {
        const url = `https://router.project-osrm.org/route/v1/driving/${ORIGIN_LON},${ORIGIN_LAT};${intercityData.lon},${intercityData.lat}?overview=false`;
        const res = await fetch(url);
        const data = await res.json();
        
        if(data.code !== "Ok" || !data.routes || data.routes.length === 0) {
            throw new Error("Маршрут не найден");
        }
        
        const distKm = data.routes[0].distance / 1000;
        let finalPrice = 0;
        
        if (distKm <= 100) {
            finalPrice = Math.round(distKm * 40);
        } else {
            finalPrice = Math.round(distKm * 37);
        }
        
        finalPrice = Math.round(finalPrice / 10) * 10;
        
        card.innerHTML = `<div class="route-title">Центр (Ленина, 61) <br>⬇<br> ${intercityData.addressName}</div>
                          <div class="price-tag">${finalPrice + minivanAdd} ₽</div>
                          <div class="modifiers-list">Расстояние: ${distKm.toFixed(1)} км<br>Тариф: ${distKm <= 100 ? '40' : '37'} ₽/км<br>${state.minivan ? '🚐 Минивэн (+500₽)' : ''}</div>`;
        card.style.display = 'block';

    } catch (e) {
        card.innerHTML = `<div class="error-msg">Не удалось проложить автомобильный маршрут. Уточните адрес.</div>`;
        card.style.display = 'block';
    } finally {
        btn.innerText = "РАССЧИТАТЬ МЕЖГОРОД";
    }
  }

</script>
